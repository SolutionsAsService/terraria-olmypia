name: build

on: [push, pull_request]

jobs:
  stub-check:
    # Always runs: lint the content, regenerate the mod, prove the generated folder is up to date, and compile it against the stub of the tModLoader API.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: python3 tools/shadwtmod/tmod.py . lint
      - run: python3 tools/shadwtmod/tmod.py . gen
      - name: The committed Olympia/ folder must match what the generator writes
        run: git diff --exit-code -- Olympia
      - run: python3 tools/shadwtmod/tmod.py . check

  real-build:
    # Experimental: builds against a real tModLoader download. Not yet seen to pass (the machine that wrote this has no route to tModLoader's releases),
    # so a failure here is information, not a blocker. The mod folder is built exactly as tModLoader's Mod Sources menu would, via tMLMod.targets.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Download tModLoader
        run: |
          curl -fsSL -o tml.zip "https://github.com/tModLoader/tModLoader/releases/latest/download/tModLoader.zip"
          mkdir -p "$RUNNER_TEMP/tml" && unzip -q tml.zip -d "$RUNNER_TEMP/tml"
          echo "TML_DIR=$RUNNER_TEMP/tml" >> "$GITHUB_ENV"
      - name: Build the mod
        run: |
          mkdir -p ModSources
          cp -r Olympia ModSources/Olympia
          printf '<Project>\n  <Import Project="$(TML_DIR)/tMLMod.targets" />\n</Project>\n' > ModSources/tModLoader.targets
          dotnet build ModSources/Olympia/Olympia.csproj -c Release
